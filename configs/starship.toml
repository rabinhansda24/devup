# ~/.config/starship.toml — installed by devup.
# Tuned for polyglot work: shows the language version only inside a project
# that uses that language, so the prompt stays short.

format = """
$directory\
$git_branch\
$git_status\
$golang\
$rust\
$python\
$nodejs\
$docker_context\
$cmd_duration\
$line_break\
$character"""

add_newline = true
command_timeout = 1000

[directory]
truncation_length = 3
truncate_to_repo = true
style = "bold cyan"
read_only = " ro"
format = "[󰉋 $path]($style) "

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold yellow)"

[git_branch]
symbol = " "
style = "bold purple"
format = "[$symbol$branch]($style) "

[git_status]
style = "bold yellow"
format = '([$all_status$ahead_behind]($style) )'
conflicted = "="
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
stashed = "$${count}"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

[cmd_duration]
min_time = 2_000
format = "[ $duration]($style) "
style = "yellow"

[golang]
symbol = " "
format = "[$symbol($version)]($style) "
style = "bold cyan"

[rust]
symbol = " "
format = "[$symbol($version)]($style) "
style = "bold red"

[python]
symbol = " "
format = '[${symbol}(${version})(\($virtualenv\))]($style) '
style = "bold yellow"

[nodejs]
symbol = " "
format = "[$symbol($version)]($style) "
style = "bold green"
# Don't announce Node in every directory that happens to contain a .js file.
detect_files = ["package.json", ".node-version"]
detect_folders = ["node_modules"]

[docker_context]
symbol = " "
format = "[$symbol$context]($style) "
style = "blue"
only_with_files = true

[package]
disabled = true
